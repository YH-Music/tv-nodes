name: subs-check

# 独立跑在 GitHub 免费机器上，不消耗老板 VPS 流量
# subs-check 是长驻 daemon，这里用 timeout 只让它跑一轮就退出 —— 根治"几天不重启就不更新"
on:
  schedule:
    - cron: "17 */6 * * *"      # 每 6 小时一轮（错开整点，避开机场 0 点重启）
  workflow_dispatch:            # 允许手动立刻跑一轮

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOK: ${{ secrets.GITHUB_TOKEN }}
      FALLBACK_VER: v1.6.5
    steps:
      - uses: actions/checkout@v4

      - name: 下载 subs-check 最新版
        run: |
          set -e
          REL=$(curl -s -H "Authorization: Bearer $GH_TOK" \
                https://api.github.com/repos/beck-8/subs-check/releases/latest)
          VER=$(echo "$REL" | jq -r '.tag_name // empty')
          ASSET=$(echo "$REL" | jq -r '.assets[]? | select(.name|test("Linux_x86_64\\.tar\\.gz")) | .browser_download_url' | head -1)
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then VER="$FALLBACK_VER"; echo "API 受限，回退到 $VER"; fi
          if [ -z "$ASSET" ] || [ "$ASSET" = "null" ]; then
            ASSET="https://github.com/beck-8/subs-check/releases/download/${VER}/subs-check_Linux_x86_64.tar.gz"
          fi
          echo "version=$VER"; echo "asset=$ASSET"
          curl -sSL --retry 3 -o sc.tar.gz "$ASSET"
          ls -la sc.tar.gz
          tar xzf sc.tar.gz
          BIN=$(find . -path ./.github -prune -o -type f -name 'subs-check' -print | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find . -path ./.github -prune -o -type f -name 'subs-check*' ! -name '*.gz' ! -name '*.yml' -print | head -1)
          fi
          echo "bin=$BIN"
          chmod +x "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: 注入 Gist 凭据（不入库）
        run: |
          python3 - <<'PY'
          import re,os
          p="config.yaml"; s=open(p,encoding="utf-8").read()
          s=re.sub(r'github-gist-id:\s*""', 'github-gist-id: "%s"'%os.environ["GIST_ID"], s)
          # subs-check 的正确键名是 github-token（写成 github-gist-token 会报"Gist配置不完整"）
          s=re.sub(r'github-token:\s*""', 'github-token: "%s"'%os.environ["GIST_TOKEN"], s)
          open(p,"w",encoding="utf-8").write(s)
          print("gist id 已注入:", os.environ["GIST_ID"][:8]+"...")
          print("注入后的 github-* 行:", [l for l in s.splitlines() if l.startswith("github-")])
          PY
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

      - name: 跑一轮检测（跑完即退出）
        run: |
          "$BIN" -f config.yaml > sc.log 2>&1 &
          PID=$!
          DONE=0
          for i in $(seq 1 290); do
            sleep 10
            if grep -qE "检测完成" sc.log; then DONE=1; echo "本轮完成，用时约 $((i*10))s"; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "进程自行退出"; DONE=1; break; fi
          done
          [ "$DONE" = "0" ] && echo "约4800s 未完成，强制停止"
          sleep 8
          kill $PID 2>/dev/null || true
          echo "--- 关键统计 ---"
          grep -E "合并去重后节点数量|存活节点数量|流媒体检测通过|可用节点数量|消耗流量|保存成功|Gist|达到成功数量限制" sc.log | tail -20 || true
          echo "--- 报错 ---"
          grep -iE "level=FATAL|level=ERROR" sc.log | tail -8 || true
          echo "--- output ---"; ls -la output/ 2>/dev/null || true

      - name: 备份本轮输出到 Actions 制品（便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodes-run
          path: output/
          retention-days: 3
          if-no-files-found: ignore
